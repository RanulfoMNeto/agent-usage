[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent-usage-widget"
version = "0.1.0"
description = "A local desktop widget for Codex and Claude Code usage"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
dependencies = ["PySide6-WebEngine==6.12.0.140"]

[project.gui-scripts]
agent-usage = "agent_usage.__main__:main"

[dependency-groups]
dev = ["ruff==0.16.8", "pip-audit==2.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent_usage"]

[tool.hatch.build.targets.sdist]
include = ["/agent_usage", "/tests", "/pyproject.toml", "/README.md", "/LICENSE", "/uv.lock"]

[tool.ruff]
required-version = "==0.16.8"
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
