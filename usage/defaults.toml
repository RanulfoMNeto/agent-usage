[collection]
# Local history scans; the widget refreshes on the same cadence.
refresh_seconds = 1

[widget]
width = 344

[integrations]
windows_shortcut = true

[limits]
# Native account queries; the widget and top bar read the cached result.
refresh_seconds = 60
timeout_seconds = 10
stale_seconds = 300

[scheduler]
# Local window scheduler check cadence; monitoring and smart analysis use zero tokens.
refresh_seconds = 15

# Optional per-agent overrides, keyed by agent ID (README › Supported agents):
# [agents.<id>]
# command = ["/absolute/path/to/agent"]
# history = "/absolute/path/to/history"
[agents]

# USD per million tokens. Standard API comparison, not subscription billing.
# Excludes Fast/Ultrafast pricing and external tools.
# https://developers.openai.com/api/docs/models/gpt-6-astra
# Verified 2026-10-09. Unlisted models have no estimate.
[prices."gpt-6-astra"]
input = 10.0
cached = 1.0
write = 12.5
output = 50.0
long_context_above = 272000
long_input_multiplier = 2.0
long_output_multiplier = 1.5
